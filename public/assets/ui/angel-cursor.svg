<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Subtle Outer Halo Glow -->
  <circle cx="5" cy="5" r="4.5" fill="#f59e0b" fill-opacity="0.3" />
  <circle cx="5" cy="5" r="3.5" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.9" />

  <!-- Angel Wings & Pointer Tip -->
  <g filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.6))">
    <!-- Left Wing -->
    <path d="M 4,5 C 2,3 0,5 1,8 C 2,10 4,10 5,8 C 5,6 4.5,5.5 4,5 Z" fill="#ffffff" stroke="#d97706" stroke-width="0.5" />
    <!-- Right Wing -->
    <path d="M 6,5 C 8,3 10,5 9,8 C 8,10 6,10 5,8 C 5,6 5.5,5.5 6,5 Z" fill="#ffffff" stroke="#d97706" stroke-width="0.5" />
    <!-- Pointer Tip -->
    <path d="M 4,2 L 10,12 L 6.5,10.5 L 4.5,15 L 3,10.5 L 0,9 Z" fill="#ffffff" stroke="#b45309" stroke-width="0.6" stroke-linejoin="round" />
  </g>
</svg>
